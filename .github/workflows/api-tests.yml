name: Automated API & UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-all-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci || npm install

      # Krok 1: Testy Postman / Newman
      - name: Run Postman API Tests via Newman
        run: |
          npx newman run postman/ecommerce_tests.postman_collection.json -e postman/ecommerce_dev.postman_environment.json
          npx newman run postman/data_driven_tests.postman_collection.json -d postman/test_data.csv -e postman/ecommerce_dev.postman_environment.json

      # Krok 2: Testy Playwright (API + UI POM)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      # Krok 3: Zapisanie raportu Playwright jako artefakt
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
